<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap');
    :root { font-family: 'Noto Sans Thai', sans-serif; color: #1E3146; }
    body { margin: 0; padding: 4px; }
    .recorder { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { font-family: inherit; border: 0; border-radius: 12px; padding: 10px 18px; color: #fff; background: linear-gradient(90deg, #2563EB, #1D4ED8); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25); cursor: pointer; font-size: 14px; font-weight: 700; transition: filter .2s ease, transform .2s ease; }
    button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    button.stop { background: #E5536B; box-shadow: 0 6px 16px rgba(229, 83, 107, 0.25); }
    button:disabled { background: #C8D6E8; box-shadow: none; cursor: default; }
    .status { font-size: 14px; color: #5A6B80; }
    .status.recording { color: #C2415A; font-weight: 700; }
    .status.error { color: #B42318; font-weight: 600; }
  </style>
</head>
<body>
  <div class="recorder">
    <button id="toggle" type="button">เริ่มอัดเสียง</button>
    <span id="status" class="status">พร้อมบันทึกเสียง</span>
  </div>
  <script>
    const TARGET_RATE = 16000;            // what the ASR models use; 3x smaller than 48 kHz
    const toggle = document.getElementById("toggle");
    const status = document.getElementById("status");
    let apiUrl = "";
    let maxSeconds = 1200;
    let stream = null, audioContext = null, processor = null, input = null;
    let samples = [], sampleRate = 44100, startedAt = 0, timer = null;
    let isRecording = false, starting = false, initialized = false;

    function sendMessage(type, data = {}) { window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*"); }
    function setHeight() { sendMessage("streamlit:setFrameHeight", { height: document.body.scrollHeight }); }
    function setStatus(message, cls = "") { status.textContent = message; status.className = "status " + cls; setHeight(); }
    function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, "0")}`; }

    function downsample(chunks, fromRate) {
      const length = chunks.reduce((t, c) => t + c.length, 0);
      const all = new Float32Array(length); let o = 0;
      chunks.forEach(c => { all.set(c, o); o += c.length; });
      if (fromRate === TARGET_RATE) return all;
      const ratio = fromRate / TARGET_RATE, outLen = Math.floor(length / ratio), out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {        // average the source samples covered by each output sample (anti-alias)
        const a = Math.floor(i * ratio), b = Math.min(length, Math.floor((i + 1) * ratio));
        let sum = 0; for (let j = a; j < b; j++) sum += all[j];
        out[i] = b > a ? sum / (b - a) : all[a] || 0;
      }
      return out;
    }

    function encodeWav(data, rate) {
      const buffer = new ArrayBuffer(44 + data.length * 2), view = new DataView(buffer);
      const w = (off, t) => [...t].forEach((ch, i) => view.setUint8(off + i, ch.charCodeAt(0)));
      w(0, "RIFF"); view.setUint32(4, 36 + data.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      w(36, "data"); view.setUint32(40, data.length * 2, true);
      let off = 44;
      for (let i = 0; i < data.length; i++) { const s = Math.max(-1, Math.min(1, data[i])); view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true); off += 2; }
      return new Uint8Array(buffer);
    }

    function toBase64(bytes) {
      let binary = ""; const n = 0x8000;
      for (let i = 0; i < bytes.length; i += n) binary += String.fromCharCode(...bytes.subarray(i, i + n));
      return btoa(binary);
    }

    async function claimConsent() {
      // Pharmacist mode: the bridge must accept RECORDING (valid, unexpired consent) before any audio is captured.
      if (!apiUrl) return { ok: true };
      try {
        const r = await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "RECORDING" }) });
        if (r.ok) return { ok: true };
        let detail = ""; try { detail = (await r.json()).detail || ""; } catch (_) {}
        return { ok: false, msg: detail || `ระบบยืนยันความยินยอมปฏิเสธ (${r.status})` };
      } catch (e) {
        return { ok: false, msg: "เชื่อมต่อระบบยืนยันความยินยอมไม่ได้ (พอร์ต 8500)" };
      }
    }

    async function startRecording() {
      if (isRecording || starting) return;
      starting = true; toggle.disabled = true;
      const claim = await claimConsent();
      if (!claim.ok) { setStatus(claim.msg, "error"); starting = false; toggle.disabled = false; return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        sampleRate = audioContext.sampleRate;
        input = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (ev) => { if (isRecording) samples.push(new Float32Array(ev.inputBuffer.getChannelData(0))); };
        input.connect(processor); processor.connect(audioContext.destination);
        samples = []; startedAt = Date.now(); isRecording = true;
        toggle.textContent = "หยุดอัดเสียง"; toggle.classList.add("stop");
        timer = setInterval(() => {
          const s = Math.round((Date.now() - startedAt) / 1000);
          setStatus(`● กำลังอัดเสียง ${fmt(s)}`, "recording");
          if (s >= maxSeconds) stopRecording();
        }, 500);
        setStatus("● กำลังอัดเสียง 0:00", "recording");
      } catch (error) {
        const secure = window.isSecureContext ? "" : " (ต้องเปิดผ่าน localhost หรือ https)";
        setStatus("เปิดไมโครโฟนไม่ได้ กรุณาอนุญาตการใช้ไมโครโฟน" + secure, "error");
      } finally { starting = false; toggle.disabled = false; }
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false; clearInterval(timer);
      try { processor && processor.disconnect(); input && input.disconnect(); } catch (_) {}
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (audioContext) audioContext.close();
      const seconds = Math.round((Date.now() - startedAt) / 1000);
      if (seconds < 1 || !samples.length) { setStatus("เสียงสั้นเกินไป กรุณาอัดใหม่", "error"); toggle.textContent = "เริ่มอัดเสียง"; toggle.classList.remove("stop"); return; }
      setStatus("กำลังเตรียมไฟล์เสียง...");
      const wav = encodeWav(downsample(samples, sampleRate), TARGET_RATE);
      samples = [];
      sendMessage("streamlit:setComponentValue", { value: { audio_base64: toBase64(wav), duration_seconds: seconds, automatic: false, sample_rate: TARGET_RATE } });
      toggle.textContent = "เริ่มอัดเสียง"; toggle.classList.remove("stop");
      setStatus(`บันทึกแล้ว ${fmt(seconds)} นาที`);
    }

    toggle.addEventListener("click", () => { if (isRecording) stopRecording(); else startRecording(); });

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render" || initialized) return;
      initialized = true;
      const args = event.data.args || {};
      apiUrl = args.api_url || "";
      if (args.max_seconds) maxSeconds = Number(args.max_seconds);
      setStatus("พร้อมบันทึกเสียง กดปุ่มเพื่อเริ่มอัด");
    });
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    setTimeout(setHeight, 0);
  </script>
</body>
</html>
